<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Баркод не сохранён</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111;
      background: #f8f9fa;
    }
    .card {
      max-width: 560px;
      width: 100%;
      padding: 26px 28px;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 14px;
      font-size: 20px;
    }
    .message {
      margin: 0 0 18px;
      font-size: 16px;
      line-height: 1.45;
      color: #b02a37;
      font-weight: 600;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 16px;
    }
    .actions a, .actions button {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid #0d6efd;
      background: #0d6efd;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
    }
    .actions button.secondary {
      background: #fff;
      color: #0d6efd;
    }
    .hint {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Не удалось скачать баркод</h1>
    <p class="message">{{ message }}</p>
    <p class="actions">
      {% if products_url %}<a href="{{ products_url }}">← Вернуться к товарам</a>{% endif %}
      <button type="button" class="secondary" onclick="history.back()">Назад</button>
    </p>
    <p class="hint">
      Если список товаров давно не обновлялся, обновите его на странице «Товары»
      и нажмите кнопку ещё раз.
    </p>
  </div>
</body>
</html>
